name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2

      - name: Setup Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      # GITHUB_TOKEN can push changeset-release/master. Creating PRs is often
      # blocked by org policy (and PATs may also be blocked). continue-on-error
      # so we can fall back to a manual PR link.
      - name: Create Version Packages PR or publish to npm
        id: changesets
        continue-on-error: true
        # changesets/action@v1.9.0
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Try opening version PR with PAT
        id: pat_pr
        if: >-
          steps.changesets.outputs.hasChangesets == 'true' &&
          steps.changesets.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_PAT secret not set — skipping PAT PR create."
            exit 1
          fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head changeset-release/master --base master \
            --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "Version PR already open."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head changeset-release/master \
            --title "chore: version packages" \
            --body "Automated Changesets version bump. Merging this PR publishes \`atroui\` to npm."

      - name: Manual Version PR link
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/compare/master...changeset-release/master?expand=1&title=chore%3A%20version%20packages"
          echo "Version branch is ready."
          echo "If no PR was created automatically, open one here:"
          echo "$url"
          echo "::notice title=Open Version PR::$url"

      - name: Fail if release step failed unexpectedly
        if: >-
          steps.changesets.outcome != 'success' &&
          steps.changesets.outputs.hasChangesets != 'true'
        run: |
          echo "::error::Release/publish failed (not a Version PR permissions issue)."
          exit 1
