name: Changeset

on:
  pull_request:
    branches: [master]
    paths:
      - "packages/ui/**"
      - ".changeset/**"

concurrency:
  group: changeset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-changeset:
    name: Require changeset for UI changes
    runs-on: ubuntu-latest
    # Maintainers can skip with label `skip-changeset` (docs-only touch of packages/ui, etc.)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2

      - name: Setup Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ensure a changeset exists
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Version Packages PRs already apply changesets - skip.
          if [[ "${{ github.head_ref }}" == "changeset-release/master" ]]; then
            echo "Version PR - skipping changeset check."
            exit 0
          fi

          # Prefer the PR base commit over origin/base...HEAD (avoids multi-merge-base noise).
          if [[ -n "${BASE_SHA:-}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BASE_SHA}...HEAD"
          else
            RANGE="origin/${{ github.base_ref }}...HEAD"
          fi
          echo "Comparing range: ${RANGE}"

          # Publishable package source only - README / markdown docs do not need a bump.
          UI_SOURCE=$(git diff --name-only "$RANGE" -- packages/ui \
            | grep -vE '\.(md|mdx)$' \
            || true)

          if [[ -z "${UI_SOURCE}" ]]; then
            echo "No publishable UI source changes (docs/README/changeset-only). OK."
            exit 0
          fi

          echo "Publishable UI source changed:"
          echo "${UI_SOURCE}"

          # Any new/changed changeset markdown on this PR counts.
          if git diff --name-only "$RANGE" | grep -qE '^\.changeset/.+\.md$'; then
            echo "Found changeset file(s)."
            git diff --name-only "$RANGE" | grep -E '^\.changeset/.+\.md$' || true
            exit 0
          fi

          # Also accept when status reports pending releases vs base.
          SINCE_REF="${BASE_SHA:-origin/${{ github.base_ref }}}"
          if pnpm exec changeset status --since="${SINCE_REF}" 2>/dev/null | grep -qiE 'packages to be bumped|has been added'; then
            echo "changeset status reports pending bumps."
            exit 0
          fi

          echo "::error::UI package source changed but no changeset found."
          echo "Run: pnpm changeset"
          echo "Or add the label 'skip-changeset' if this PR should not bump the package."
          exit 1
